name: Steve CMS CI/CD Pipeline

on:
  push:
    branches:
      - main
      - e2v
      - maxvolt
      - 'feature/**'
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Run Automated Tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_DATABASE: stevedb
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, ctype, xml, json, bcmath
          coverage: none

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Prepare Environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run Tests
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: stevedb
          DB_USERNAME: root
          DB_PASSWORD: secret
        run: php artisan test

  deploy:
    name: Deploy to Production
    needs: test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/e2v'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_SERVER_IP }}
          username: ${{ secrets.PROD_SERVER_USER }}
          key: ${{ secrets.PROD_SERVER_SSH_KEY }}
          script: |
            cd /home/steve-cms
            git pull origin ${{ github.ref_name }}
            docker compose run --rm steve-cms-app composer install --no-dev --optimize-autoloader
            docker compose up -d --build
            docker exec steve-cms-app php artisan migrate --force
            docker exec steve-cms-app php artisan config:cache
            docker exec steve-cms-app php artisan route:cache
            docker exec steve-cms-app php artisan view:cache
            docker restart steve-monitor-daemon
